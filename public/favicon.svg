<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Vibrant Coral to Deep Warm Terracotta -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7343" />
      <stop offset="55%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b83812" />
    </linearGradient>

    <!-- Top Soft Ambient Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sparkle Star Golden Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff385" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cart Drop Shadow -->
    <filter id="cartShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle: Standard Apple/Modern app curve -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Top Ambient Sheen -->
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#sheenGrad)" />

  <!-- Inner Contrast Highlight Rim -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.35" />

  <!-- Shopping Cart Group with Soft Shadow -->
  <g filter="url(#cartShadow)">
    <!-- Cart Basket Frame and Handle -->
    <path d="M 124 164 L 164 164 L 206 312 L 374 312 L 408 202 L 180 202"
          fill="none"
          stroke="#ffffff"
          stroke-width="30"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Basket Horizontal Crossbar -->
    <path d="M 193 257 L 390 257"
          fill="none"
          stroke="#ffffff"
          stroke-width="22"
          stroke-linecap="round" />

    <!-- Basket Vertical Ribs -->
    <path d="M 245 204 L 245 310 M 295 204 L 295 310 M 345 204 L 345 310"
          fill="none"
          stroke="#ffffff"
          stroke-width="18"
          stroke-linecap="round" />

    <!-- Solid White Wheels with Terracotta Core -->
    <circle cx="218" cy="372" r="28" fill="#ffffff" />
    <circle cx="218" cy="372" r="12" fill="#c2410c" />

    <circle cx="362" cy="372" r="28" fill="#ffffff" />
    <circle cx="362" cy="372" r="12" fill="#c2410c" />
  </g>

  <!-- Floating Wishlist/Redux Sparkle Stars -->
  <g filter="url(#starGlow)">
    <!-- Primary Star -->
    <path d="M 336 104 C 336 126 348 138 370 138 C 348 138 336 150 336 172 C 336 150 324 138 302 138 C 324 138 336 126 336 104 Z"
          fill="url(#starGrad)" />
    <!-- Secondary Accent Star -->
    <path d="M 392 152 C 392 162 398 168 408 168 C 398 168 392 174 392 184 C 392 174 386 168 376 168 C 386 168 392 162 392 152 Z"
          fill="url(#starGrad)" />
  </g>
</svg>
